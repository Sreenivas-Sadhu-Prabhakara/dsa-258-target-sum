<text x="56.0" y="202.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Count subsets of five 1s summing to 4: choose which four carry '+' — C(5,4) = 5</text>
